<!doctype html>
<meta charset="utf-8" />
<title>Fala — visualizacao em telas pequenas</title>
<!--
  Ferramenta de desenvolvimento, NAO faz parte do app.
  Fica na raiz de `web/` (e nao em `public/`) de proposito: o Vite serve este
  arquivo em `npm run dev` mas nao o copia para `dist/`, entao ele nunca vai
  ao ar.

  Existe porque media query dentro de iframe responde a largura do iframe, o
  que da um teste de layout responsivo fiel sem depender de emulador. Foi assim
  que apareceu o "grid blowout" que esticava o documento para 599px numa tela
  de 390.

  Abra em: http://localhost:5173/mobile.html
-->
<style>
  body { margin: 0; background: #222; display: flex; gap: 16px; padding: 12px; font: 12px system-ui; color: #ccc }
  figure { margin: 0 }
  iframe { border: 0; display: block; background: #000 }
</style>
<figure>
  <figcaption>390 × 780 (celular)</figcaption>
  <iframe src="/Universal-Language/" width="390" height="780"></iframe>
</figure>
<figure>
  <figcaption>320 × 640 (celular pequeno)</figcaption>
  <iframe src="/Universal-Language/" width="320" height="640"></iframe>
</figure>
<figure>
  <figcaption>780 × 500 (celular deitado)</figcaption>
  <iframe src="/Universal-Language/" width="780" height="500"></iframe>
</figure>
