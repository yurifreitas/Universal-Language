<!doctype html>
<meta charset="utf-8" />
<title>Fala — visualizacao em telas pequenas</title>
<!--
  Ferramenta de desenvolvimento, NAO faz parte do app. Fica na raiz de `web/`
  (e nao em `public/`) de proposito: o Vite serve este arquivo em `npm run dev`
  mas nao o copia para `dist/`, entao ele nunca vai ao ar.

  Media query dentro de iframe responde a largura do iframe, o que da um teste
  de layout responsivo fiel sem depender de emulador. Foi assim que apareceram
  o "grid blowout" que esticava o documento para 599px numa tela de 390 e o
  dialogo que abria com opacity 0.
-->
<style>
  body { margin:0; background:#222; display:flex; gap:14px; padding:10px; font:12px system-ui; color:#ccc; align-items:flex-start }
  figure { margin:0 }
  iframe { border:0; display:block; background:#000 }
</style>
<figure><figcaption>390 × 780</figcaption>
  <iframe id="a" src="/Universal-Language/" width="390" height="780"></iframe></figure>
<figure><figcaption>320 × 640</figcaption>
  <iframe id="b" src="/Universal-Language/" width="320" height="640"></iframe></figure>
